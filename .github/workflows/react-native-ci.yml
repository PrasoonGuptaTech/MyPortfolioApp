name: Dev
on:
  workflow_dispatch:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
concurrency:
  group: react-native-ci
  cancel-in-progress: true
env:
  NODE_VERSION: 20
jobs:
  ai_review:
    name: AI Code Review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: AI Review
        uses: coderabbitai/ai-pr-reviewer@latest
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          debug: true
      - name: Print AI Reiew result
        run: echo "${{ steps.review.outputs.review_result }}"
      - name: Fail if AI Review finds issues
        run: |
          if [ "${{ steps.review.outputs.review_status }}" != "pass" ]; then
            echo "AI Review Failed:"
            echo "${{ steps.review.outputs.review_result }}"
            exit 1
          fi
  build:
    name: Setup
    runs-on: ubuntu-latest
    needs: ai_review
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci
      - name: Run Lint
        run: npm run lint
      - name: Generate Unit Test Coverage
        run: npm test -- --coverage
      - name: Upload Coverage Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage
  android_build:
    name: Android Build
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle
      - name: Install Dependencies
        run: npm ci
      - name: Build Android
        run: |
          cd android
          ./gradlew assembleDebug --build-cache
          cd ..
      - name: Upload Debug Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PrasoonPortfolioAndroid.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
  ios_build:
    name: IOS Build
    runs-on: macos-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci
      - name: Install Pods
        uses: actions/cache@v4
        with: 
          path: ios/pods
          key: pods-${{ runner.os }}-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            pods-${{ runner.os }}
      - name: Install cocoapods
        run: |
          sudo gem install cocoapods
          cd ios
          pod install --repo-update
          cd ..
      - name: Build IOS
        run: |
          cd ios
          xcodebuild \
          -workspace PrasoonPortfolioApp.xcworkspace \
          -scheme PrasoonPortfolioApp \
          -configuration Release \
          -sdk iphoneos \
          -destination 'generic/platform=iOS' \
          -archivePath build/PrasoonPortfolioApp.xcarchive \
          CODE_SIGNING_ALLOWED=NO \
          SKIP_INSTALL=NO \
          archive
          cd ..
      - name: Upload iOS Archive Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrasoonPortfolioIOS.xcarchive
          path: ios/build/PrasoonPortfolioApp.xcarchive